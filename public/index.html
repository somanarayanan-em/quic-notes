<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QUIC Notes</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 1rem; }
    form { display: flex; gap: .5rem; margin-bottom: 1rem; }
    input { flex: 1; padding: .5rem; }
    button { padding: .5rem .9rem; cursor: pointer; }
    ul { list-style: none; padding: 0; }
    li { display: flex; justify-content: space-between; align-items: center;
         padding: .6rem .8rem; border: 1px solid #ddd; border-radius: 6px; margin-bottom: .5rem; }
    small { color: #777; display: block; }
  </style>
</head>
<body>
  <h1>QUIC Notes</h1>
  <form id="note-form">
    <input id="note-text" placeholder="Write a note..." autocomplete="off" required />
    <button type="submit">Add</button>
  </form>
  <ul id="notes"></ul>

  <script>
    const list = document.getElementById("notes");
    const form = document.getElementById("note-form");
    const input = document.getElementById("note-text");

    async function loadNotes() {
      const res = await fetch("/api/notes");
      const notes = await res.json();
      list.innerHTML = "";
      for (const n of notes) {
        const li = document.createElement("li");
        const span = document.createElement("span");
        span.textContent = n.text;
        const small = document.createElement("small");
        small.textContent = new Date(n.createdAt).toLocaleString();
        span.appendChild(small);
        li.appendChild(span);
        list.appendChild(li);
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      await fetch("/api/notes", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: input.value })
      });
      input.value = "";
      loadNotes();
    });

    loadNotes();
  </script>
</body>
</html>
